{% extends "base.html" %}

{% block content %}
{% if messages %}
{% for message in messages %}
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
    <strong>{{  message }}</strong>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
{% endfor %}

{% endif %}

<form method="POST" class="post-form" action="" enctype="multipart/form-data" >
    {% csrf_token %}
    <fieldset class="border rounded-3 p-3">
        <legend class="float-none w-auto px-3" >New User</legend>

        <div>
          <div class="d-flex justify-content-center mb-4">
              <img id="selectedAvatar" src="https://mdbootstrap.com/img/Photos/Others/placeholder-avatar.jpg"
              class="rounded-circle" style="width: 7em; height: 7em; object-fit: cover;" alt="example placeholder" />
          </div>
          <div class="d-flex justify-content-center">
              <div data-mdb-ripple-init class="btn btn-primary btn-rounded">
                  <label class="form-label text-white m-1" for="avatar">Choose file</label>
                  <input type="file" class="form-control d-none" id="avatar" name="avatar" onchange="displaySelectedImage(event, 'selectedAvatar')" />
              </div>
          </div>
      </div>

<div class="mb-3">
  <label for="username"  class="form-label">Username</label>
  <input type="text" class="form-control" name="username" id="username" placeholder="Username">
</div>
<div class="mb-3">
  <label for="password" class="form-label">Password</label>
  <input type="password" class="form-control" id="password" name="password" placeholder="Password">
</div>

 <button type="submit" class="save btn btn-default">Confirm</button>
        </fieldset>
</form>


<script>

function displaySelectedImage(event, elementId) {
    const selectedImage = document.getElementById(elementId);
    const fileInput = event.target;

    if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();

        reader.onload = function(e) {
            selectedImage.src = e.target.result;
        };

        reader.readAsDataURL(fileInput.files[0]);
    }
}

</script>

{% endblock %}
